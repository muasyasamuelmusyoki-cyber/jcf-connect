  <script>
    var API = '/api';
    var isEditMode = false;
    var editingId = null;

    function getToken() {
      return localStorage.getItem('jcf_token') || '';
    }
    function getSession() {
      try { return JSON.parse(localStorage.getItem('jcf_user') || 'null'); }
      catch (e) { return null; }
    }
    function logout() {
      localStorage.removeItem('jcf_token');
      localStorage.removeItem('jcf_user');
      window.location.href = 'login.html';
    }
    function apiFetch(path, options) {
      options = options || {};
      options.headers = options.headers || {};
      options.headers['Authorization'] = 'Bearer ' + getToken();
      if (options.body) options.headers['Content-Type'] = 'application/json';
      return fetch(API + path, options).then(function (res) {
        if (res.status === 401) {
          logout();
          return Promise.reject(new Error('Unauthorized'));
        }
        return res.text().then(function (text) {
          var data = null;
          try { data = text ? JSON.parse(text) : null; }
          catch (e) {
            return Promise.reject(new Error('Bad response (status ' + res.status + '). Is /api/events registered?'));
          }
          return { ok: res.ok, status: res.status, data: data };
        });
      });
    }

    function toggleRecurrence() {
      var show = document.getElementById('isRecurring').checked;
      document.getElementById('recurrenceGroup').style.display = show ? 'flex' : 'none';
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(function (el) { el.classList.remove('show'); });
      document.querySelectorAll('input, select').forEach(function (el) { el.classList.remove('error'); });
      document.getElementById('errorMsg').classList.remove('show');
    }

    function validate() {
      clearErrors();
      var valid = true;
      var title = document.getElementById('title').value.trim();
      var date = document.getElementById('date').value;
      if (!title) {
        document.getElementById('title').classList.add('error');
        document.getElementById('errTitle').classList.add('show');
        valid = false;
      }
      if (!date) {
        document.getElementById('date').classList.add('error');
        document.getElementById('errDate').classList.add('show');
        valid = false;
      }
      return valid;
    }

    function fillForm(e) {
      document.getElementById('eventId').value = e.id || '';
      document.getElementById('title').value = e.title || '';
      document.getElementById('type').value = e.type || 'Sunday Service';
      document.getElementById('status').value = e.status || 'Planned';
      document.getElementById('date').value = e.date || '';
      document.getElementById('endDate').value = e.end_date || e.endDate || '';
      document.getElementById('startTime').value = e.start_time || e.startTime || '';
      document.getElementById('endTime').value = e.end_time || e.endTime || '';
      document.getElementById('venue').value = e.venue || '';
      document.getElementById('organizer').value = e.organizer || '';
      document.getElementById('department').value = e.department || '';
      document.getElementById('expectedAttendance').value = e.expected_attendance != null
        ? e.expected_attendance
        : (e.expectedAttendance || 0);
      document.getElementById('description').value = e.description || '';
      document.getElementById('notes').value = e.notes || '';
      document.getElementById('isRecurring').checked = !!(e.is_recurring || e.isRecurring);
      document.getElementById('recurrence').value = e.recurrence || '';
      toggleRecurrence();
    }

    function saveEvent(ev) {
      ev.preventDefault();
      if (!validate()) {
        document.getElementById('errorMsg').textContent = 'Please fix the errors above.';
        document.getElementById('errorMsg').classList.add('show');
        return;
      }
      if (!getToken()) {
        alert('Please login first');
        window.location.href = 'login.html';
        return;
      }

      var record = {
        id: document.getElementById('eventId').value || ('EVT-' + Date.now()),
        title: document.getElementById('title').value.trim(),
        type: document.getElementById('type').value,
        status: document.getElementById('status').value,
        date: document.getElementById('date').value,
        endDate: document.getElementById('endDate').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        venue: document.getElementById('venue').value.trim(),
        organizer: document.getElementById('organizer').value.trim(),
        department: document.getElementById('department').value.trim(),
        expectedAttendance: parseInt(document.getElementById('expectedAttendance').value, 10) || 0,
        description: document.getElementById('description').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      var path = isEditMode
        ? '/events/' + encodeURIComponent(editingId)
        : '/events';
      var method = isEditMode ? 'PUT' : 'POST';

      apiFetch(path, { method: method, body: JSON.stringify(record) })
        .then(function (result) {
          if (!result.ok) {
            document.getElementById('errorMsg').textContent =
              (result.data && result.data.error) || ('Save failed (status ' + result.status + ')');
            document.getElementById('errorMsg').classList.add('show');
            return;
          }
          document.getElementById('successMsg').textContent = isEditMode
            ? 'Event updated successfully!'
            : 'Event "' + record.title + '" saved successfully!';
          document.getElementById('successMsg').classList.add('show');
          document.getElementById('errorMsg').classList.remove('show');
          setTimeout(function () {
            window.location.href = 'events.html';
          }, 900);
        })
        .catch(function (err) {
          document.getElementById('errorMsg').textContent = err.message || 'Cannot reach server';
          document.getElementById('errorMsg').classList.add('show');
        });
    }

    if (!getToken() || !getSession()) {
      window.location.href = 'login.html';
    } else {
      var params = new URLSearchParams(window.location.search);
      var editId = params.get('id');

      if (editId) {
        isEditMode = true;
        editingId = editId;
        document.getElementById('pageTitle').textContent = 'Edit Event';
        document.getElementById('pageSubtitle').textContent = 'Update event details';
        document.getElementById('saveBtn').textContent = 'Update Event';
        document.title = 'Edit Event – JCF Connect';

        apiFetch('/events/' + encodeURIComponent(editId))
          .then(function (result) {
            if (result.ok && result.data) {
              fillForm(result.data);
            } else {
              alert('Event not found');
              window.location.href = 'events.html';
            }
          })
          .catch(function () {
            alert('Could not load event');
            window.location.href = 'events.html';
          });
      } else {
        document.getElementById('eventId').value = 'EVT-' + Date.now();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        document.getElementById('status').value = 'Planned';
      }
    }
  </script>
