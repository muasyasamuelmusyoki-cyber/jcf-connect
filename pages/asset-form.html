<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asset Form – JCF Connect</title>
  <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpg" />
  <link rel="apple-touch-icon" href="../assets/images/logo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #c41e3a;
      --gold: #d4a017;
      --bg: #080f18;
      --sidebar: #0c1524;
      --card: #111c2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3352;
      --input-bg: #0c1524;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 1.25rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .sidebar-logo {
      width: 42px; height: 42px;
      object-fit: contain;
      border-radius: 50%;
      background: rgba(196,30,58,0.15);
      padding: 4px;
    }
    .sidebar-brand h1 { font-size: 0.85rem; font-weight: 700; }
    .sidebar-brand span {
      font-size: 0.62rem;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 600;
    }
    .sidebar-nav { flex: 1; padding: 0.75rem; overflow-y: auto; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.72rem 0.85rem;
      border-radius: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 0.2rem;
      min-height: 44px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active {
      background: rgba(196,30,58,0.15);
      color: #ff6b7a;
      border: 1px solid rgba(196,30,58,0.25);
    }
    .nav-icon { width: 1.35rem; text-align: center; }
    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: center;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 90;
    }
    .sidebar-overlay.show { display: block; }
    .main { flex: 1; margin-left: 260px; min-height: 100vh; min-width: 0; }
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 50;
      flex-wrap: wrap;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.45rem;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
    }
    .topbar-left h2 { font-size: 1.1rem; }
    .topbar-left p { font-size: 0.78rem; color: var(--text-muted); }
    .content { padding: 1.25rem; max-width: 900px; }
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.35rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; color: var(--text-muted); }
    input, select, textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,30,58,0.15);
    }
    textarea { min-height: 80px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 1.25rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--border);
    }
    .btn {
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      min-height: 44px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9b1b2e);
      color: white;
    }
    .btn-primary:disabled { opacity: 0.7; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .success-msg, .error-msg {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
    }
    .success-msg {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
    .error-msg {
      background: rgba(196,30,58,0.12);
      border: 1px solid rgba(196,30,58,0.3);
      color: #fca5a5;
    }
    .success-msg.show, .error-msg.show { display: block; }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); width: min(280px, 85vw); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
      .form-grid { grid-template-columns: 1fr; }
      .content { padding: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/images/logo.jpg" alt="Logo" class="sidebar-logo" />
      <div class="sidebar-brand">
        <h1>JCF Connect</h1>
        <span>City of Champions</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="members.html" class="nav-item"><span class="nav-icon">👥</span> Members</a>
      <a href="visitors.html" class="nav-item"><span class="nav-icon">👋</span> Visitors</a>
      <a href="growth-groups.html" class="nav-item"><span class="nav-icon">🌿</span> Growth Groups</a>
      <a href="departments.html" class="nav-item"><span class="nav-icon">🏛️</span> Departments</a>
      <a href="leaders.html" class="nav-item"><span class="nav-icon">⭐</span> Leaders</a>
      <a href="attendance.html" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
      <a href="champs-house.html" class="nav-item"><span class="nav-icon">🎓</span> Champs House</a>
      <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span> Finance</a>
      <a href="assets.html" class="nav-item active"><span class="nav-icon">📦</span> Assets</a>
      <a href="events.html" class="nav-item"><span class="nav-icon">📅</span> Events</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span> Reports</a>
      <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">JCF CONNECT</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="menu-toggle" onclick="openSidebar()">☰</button>
        <div>
          <h2 id="pageTitle">Add Asset</h2>
          <p id="pageSubtitle">Register church equipment</p>
        </div>
      </div>
      <a href="assets.html" class="btn btn-secondary">← Back</a>
    </header>

    <div class="content">
      <div class="success-msg" id="successMsg"></div>
      <div class="error-msg" id="errorMsg"></div>

      <form class="form-card" onsubmit="saveAsset(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Asset ID</label>
            <input type="text" id="assetId" readonly style="opacity:0.7;" />
          </div>
          <div class="form-group">
            <label>Name *</label>
            <input type="text" id="name" required placeholder="e.g. Mixer board" />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Media">Media</option>
              <option value="Sound">Sound</option>
              <option value="Audio Visual">Audio Visual</option>
              <option value="Musical Instruments">Musical Instruments</option>
              <option value="IT Equipment">IT Equipment</option>
              <option value="Furniture">Furniture</option>
              <option value="Vehicle">Vehicle</option>
              <option value="Kitchen">Kitchen</option>
              <option value="Generator / Power">Generator / Power</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Serial number</label>
            <input type="text" id="serialNumber" />
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="quantity" min="1" value="1" />
          </div>
          <div class="form-group">
            <label>Condition</label>
            <select id="condition">
              <option value="New">New</option>
              <option value="Good" selected>Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Available">Available</option>
              <option value="In Use">In Use</option>
              <option value="Under Repair">Under Repair</option>
              <option value="Lost">Lost</option>
            </select>
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" placeholder="e.g. Main sanctuary" />
          </div>
          <div class="form-group">
            <label>Purchase value (KES)</label>
            <input type="number" id="purchaseValue" min="0" step="1" value="0" />
          </div>
          <div class="form-group">
            <label>Assigned to</label>
            <input type="text" id="assignedTo" placeholder="Person or team" />
          </div>
          <div class="form-group full">
            <label>Notes</label>
            <textarea id="notes"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <a href="assets.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Asset</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var API = '/api';
    var editingId = null;

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
      document.body.style.overflow = '';
    }
    function getToken() { return localStorage.getItem('jcf_token') || ''; }
    function getSession() {
      try { return JSON.parse(localStorage.getItem('jcf_user') || 'null'); }
      catch (e) { return null; }
    }
    function apiFetch(path, options) {
      options = options || {};
      options.headers = options.headers || {};
      options.headers['Authorization'] = 'Bearer ' + getToken();
      if (options.body) options.headers['Content-Type'] = 'application/json';
      return fetch(API + path, options).then(function (res) {
        if (res.status === 401) {
          localStorage.removeItem('jcf_token');
          localStorage.removeItem('jcf_user');
          window.location.href = 'login.html';
          return Promise.reject(new Error('Unauthorized'));
        }
        return res.text().then(function (text) {
          var data = null;
          try { data = text ? JSON.parse(text) : null; }
          catch (e) { return Promise.reject(new Error('Bad response ' + res.status)); }
          return { ok: res.ok, status: res.status, data: data };
        });
      });
    }
    function fillForm(a) {
      document.getElementById('assetId').value = a.id || '';
      document.getElementById('name').value = a.name || '';
      document.getElementById('category').value = a.category || '';
      document.getElementById('serialNumber').value = a.serialNumber || a.serial_number || '';
      document.getElementById('quantity').value = a.quantity || 1;
      document.getElementById('condition').value = a.condition || 'Good';
      document.getElementById('status').value = a.status || 'Available';
      document.getElementById('location').value = a.location || '';
      document.getElementById('purchaseValue').value =
        a.purchaseValue != null ? a.purchaseValue : (a.purchase_value || 0);
      document.getElementById('assignedTo').value = a.assignedTo || a.assigned_to || '';
      document.getElementById('notes').value = a.notes || '';
    }
    function saveAsset(e) {
      e.preventDefault();
      var err = document.getElementById('errorMsg');
      var ok = document.getElementById('successMsg');
      err.classList.remove('show');
      ok.classList.remove('show');

      var body = {
        id: document.getElementById('assetId').value,
        name: document.getElementById('name').value.trim(),
        category: document.getElementById('category').value,
        serialNumber: document.getElementById('serialNumber').value.trim(),
        quantity: parseInt(document.getElementById('quantity').value, 10) || 1,
        condition: document.getElementById('condition').value,
        status: document.getElementById('status').value,
        location: document.getElementById('location').value.trim(),
        purchaseValue: parseFloat(document.getElementById('purchaseValue').value) || 0,
        assignedTo: document.getElementById('assignedTo').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };
      if (!body.name || !body.category) {
        err.textContent = 'Name and category are required.';
        err.classList.add('show');
        return;
      }

      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      var path = editingId ? '/assets/' + encodeURIComponent(editingId) : '/assets';
      var method = editingId ? 'PUT' : 'POST';

      apiFetch(path, { method: method, body: JSON.stringify(body) })
        .then(function (result) {
          btn.disabled = false;
          if (!result.ok) {
            err.textContent = (result.data && result.data.error) || ('Save failed (' + result.status + ')');
            err.classList.add('show');
            return;
          }
          ok.textContent = editingId ? 'Asset updated!' : 'Asset saved!';
          ok.classList.add('show');
          setTimeout(function () { window.location.href = 'assets.html'; }, 800);
        })
        .catch(function (ex) {
          btn.disabled = false;
          err.textContent = ex.message || 'Cannot reach server';
          err.classList.add('show');
        });
    }

    if (!getToken() || !getSession()) {
      window.location.href = 'login.html';
    } else {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (id) {
        editingId = id;
        document.getElementById('pageTitle').textContent = 'Edit Asset';
        document.getElementById('pageSubtitle').textContent = 'Update asset details';
        document.getElementById('saveBtn').textContent = 'Update Asset';
        apiFetch('/assets/' + encodeURIComponent(id))
          .then(function (result) {
            if (result.ok && result.data) fillForm(result.data);
            else {
              alert('Asset not found');
              window.location.href = 'assets.html';
            }
          })
          .catch(function () {
            alert('Could not load asset');
            window.location.href = 'assets.html';
          });
      } else {
        document.getElementById('assetId').value = 'AST-' + Date.now();
      }
    }
  </script>
  <script src="js/access.js"></script>
</body>
</html>
