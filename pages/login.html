<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCF Connect – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    :root {
      --accent: #c41e3a;
      --accent-hover: #e63950;
      --gold: #d4a017;
      --bg: #080f18;
      --card: #111c2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3352;
      --input-bg: #0c1524;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 10%, rgba(196,30,58,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 85% 90%, rgba(30,58,95,0.18) 0%, transparent 55%);
      pointer-events: none;
    }
    .login-container { width: 100%; max-width: 440px; padding: 1.5rem; position: relative; z-index: 1; }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.6rem 2.2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.55);
    }
    .logo-section { text-align: center; margin-bottom: 2rem; }
    .logo-wrapper {
      display: inline-flex;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(196,30,58,0.15), rgba(30,58,95,0.2));
      border: 1px solid rgba(196,30,58,0.25);
      align-items: center; justify-content: center;
      margin-bottom: 1rem;
    }
    .logo { width: 70px; height: 70px; object-fit: contain; }
    .church-name { font-size: 1.15rem; font-weight: 700; }
    .slogan { font-size: 0.76rem; font-weight: 600; color: var(--gold); letter-spacing: 0.13em; text-transform: uppercase; margin-top: 0.35rem; }
    .system-name {
      display: inline-block; margin-top: 0.85rem; font-size: 0.7rem; color: var(--text-muted);
      background: rgba(255,255,255,0.04); padding: 0.28rem 0.7rem; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .form-group { margin-bottom: 1.15rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; }
    .input-wrapper { position: relative; }
    input {
      width: 100%; padding: 0.88rem 1rem; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 11px; color: var(--text);
      font-size: 0.95rem; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(196,30,58,0.18); }
    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 0.8rem; font-family: inherit;
    }
    .options-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem; font-size: 0.85rem;
    }
    .remember { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); cursor: pointer; }
    .remember input { width: 15px; height: 15px; accent-color: var(--accent); }
    .forgot { color: var(--accent-hover); text-decoration: none; font-weight: 500; }
    .btn-login {
      width: 100%; padding: 0.95rem;
      background: linear-gradient(135deg, var(--accent), #9b1b2e);
      color: white; border: none; border-radius: 11px; font-size: 1rem;
      font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .btn-login:disabled { opacity: 0.75; cursor: not-allowed; }
    .error-msg, .success-msg {
      padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem;
      margin-bottom: 1.2rem; display: none; align-items: center; gap: 0.5rem;
    }
    .error-msg { background: rgba(196,30,58,0.12); border: 1px solid rgba(196,30,58,0.3); color: #fca5a5; }
    .success-msg { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .error-msg.show, .success-msg.show { display: flex; }
    .footer { text-align: center; margin-top: 1.8rem; font-size: 0.75rem; color: var(--text-muted); line-height: 1.7; }
    .hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
    .captcha-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-wrapper">
          <img src="../assets/images/logo.jpg" alt="Logo" class="logo" onerror="this.style.display='none'" />
        </div>
        <div class="church-name">JOY CHRISTIAN FELLOWSHIP – RONGAI</div>
        <div class="slogan">City of Champions</div>
        <div class="system-name">JCF CONNECT</div>
      </div>

      <div class="error-msg" id="errorMsg"><span>⚠</span><span id="errorText">Error</span></div>
      <div class="success-msg" id="successMsg"><span>✓</span><span>Login successful. Redirecting...</span></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" autofocus />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle" id="passwordToggle">Show</button>
          </div>
        </div>
        <div class="options-row">
          <label class="remember">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <a href="forgot-password.html" class="forgot">Forgot password?</a>
        </div>

        <!-- Paste YOUR Site Key from Google if this one is different -->
        <div class="captcha-wrap">
          <div class="g-recaptcha" data-sitekey="6LeYeswtAAAAAC3rYUllOWkll8EHqUZs3NgUSN6I"></div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div id="twoFactorBox" style="display:none;">
        <p class="hint">Enter the 6-digit code from your authenticator app.</p>
        <div class="form-group">
          <label for="otpCode">Authentication code</label>
          <input type="text" id="otpCode" maxlength="6" placeholder="123456" autocomplete="one-time-code" />
        </div>
        <button type="button" class="btn-login" id="verify2FABtn">Verify</button>
       <button type="button" class="btn-login" id="backToLoginBtn" style="margin-top:0.75rem;background:transparent;border:1px solid var(--text-muted);box-shadow:none;">Back</button>
      </div>

      <div class="footer">
        <strong>JCF CONNECT</strong><br>
        © Joy Christian Fellowship – Rongai
      </div>
    </div>
  </div>

  <script>
    var API = '/api';
    window._pending2FA = null;

    function togglePassword() {
      var input = document.getElementById('password');
      var btn = document.querySelector('.password-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var error = document.getElementById('errorMsg');
      var errorText = document.getElementById('errorText');
      var success = document.getElementById('successMsg');
      var email = document.getElementById('email').value.trim().toLowerCase();
      var password = document.getElementById('password').value;

      error.classList.remove('show');
      success.classList.remove('show');

      if (!email || !password) {
        errorText.textContent = 'Please fill in all fields.';
        error.classList.add('show');
        return;
      }

      var recaptchaToken = (window.grecaptcha && grecaptcha.getResponse()) || '';
      if (!recaptchaToken) {
        errorText.textContent = 'Please tick “I\'m not a robot”.';
        error.classList.add('show');
        return;
      }

      btn.disabled = true;

      fetch(API + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          password: password,
          recaptchaToken: recaptchaToken
        })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          btn.disabled = false;
          if (!result.ok) {
            errorText.textContent = (result.data && result.data.error) || 'Invalid email or password.';
            error.classList.add('show');
            if (window.grecaptcha) grecaptcha.reset();
            return;
          }

          if (result.data.requires2FA) {
            window._pending2FA = result.data.pendingToken;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('twoFactorBox').style.display = 'block';
            document.getElementById('otpCode').focus();
            return;
          }

          finishLogin(result.data);
        })
        .catch(function () {
          btn.disabled = false;
          if (window.grecaptcha) grecaptcha.reset();
          errorText.textContent = 'Cannot reach server. Keep npm start running.';
          error.classList.add('show');
        });
    }

    function finishLogin(data) {
      localStorage.setItem('jcf_token', data.token);
      localStorage.setItem('jcf_user', JSON.stringify(data.user));
      if (document.getElementById('remember').checked) {
        localStorage.setItem('jcf_remember', document.getElementById('email').value.trim().toLowerCase());
      } else {
        localStorage.removeItem('jcf_remember');
      }
      document.getElementById('successMsg').classList.add('show');
      setTimeout(function () {
        window.location.href = 'dashboard.html';
      }, 700);
    }

    function verify2FA() {
      var code = document.getElementById('otpCode').value.trim();
      var error = document.getElementById('errorMsg');
      var errorText = document.getElementById('errorText');

      if (!code || !window._pending2FA) {
        errorText.textContent = 'Enter the 6-digit code.';
        error.classList.add('show');
        return;
      }

      fetch(API + '/auth/verify-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pendingToken: window._pending2FA, code: code })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok) {
            errorText.textContent = (result.data && result.data.error) || 'Invalid code';
            error.classList.add('show');
            return;
          }
          finishLogin(result.data);
        })
        .catch(function () {
          errorText.textContent = 'Cannot reach server.';
          error.classList.add('show');
        });
    }

   function backToLogin() {
  window._pending2FA = null;
  document.getElementById('twoFactorBox').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('errorMsg').classList.remove('show');
  if (window.grecaptcha) grecaptcha.reset();
}

document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.getElementById('passwordToggle').addEventListener('click', togglePassword);
document.getElementById('verify2FABtn').addEventListener('click', verify2FA);
document.getElementById('backToLoginBtn').addEventListener('click', backToLogin);
  </script>
</body>
</html>
