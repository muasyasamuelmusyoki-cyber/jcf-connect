<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpg" />
  <link rel="apple-touch-icon" href="../assets/images/logo.jpg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – JCF Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #c41e3a;
      --accent-hover: #e63950;
      --bg: #080f18;
      --card: #111c2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3352;
      --input-bg: #0c1524;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(196,30,58,0.1) 0%, transparent 55%);
      pointer-events: none;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.2rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo-section { text-align: center; margin-bottom: 1.8rem; }
    .logo-wrapper {
      display: inline-flex;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(196,30,58,0.15), rgba(30,58,95,0.2));
      border: 1px solid rgba(196,30,58,0.25);
      align-items: center; justify-content: center;
      margin-bottom: 0.9rem;
    }
    .logo { width: 55px; height: 55px; object-fit: contain; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.35rem; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.88rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,30,58,0.18);
    }
    .btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--accent), #9b1b2e);
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(196,30,58,0.35);
    }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      box-shadow: none;
      margin-top: 0.75rem;
    }
    .msg {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .msg.error {
      background: rgba(196,30,58,0.12);
      border: 1px solid rgba(196,30,58,0.3);
      color: #fca5a5;
    }
    .msg.success {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
    .msg.show { display: block; }
    .step { display: none; }
    .step.active { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent-hover); }
    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="../assets/images/logo.jpg" alt="Logo" class="logo" onerror="this.style.display='none'" />
      </div>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your account email. We will send a 6-digit code.</p>
    </div>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <div class="step active" id="step1">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <button type="button" class="btn" id="sendBtn" onclick="sendCode()">Send Reset Code</button>
      <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <div class="step" id="step2">
      <p class="hint">Check your email inbox (and spam folder) for the 6-digit code. It expires in 10 minutes.</p>
      <div class="form-group">
        <label for="code">Enter 6-digit Code</label>
        <input type="text" id="code" placeholder="123456" maxlength="6" />
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" />
      </div>
      <button type="button" class="btn" id="resetBtn" onclick="resetPassword()">Reset Password</button>
      <button type="button" class="btn btn-secondary" onclick="goBack()">Use different email</button>
    </div>
  </div>

  <script>
    var API = '/api';
    var currentEmail = '';

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showSuccess(msg) {
      var el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    function sendCode() {
      var email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) {
        showError('Please enter your email address.');
        return;
      }

      var btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      fetch(API + '/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          btn.disabled = false;
          btn.textContent = 'Send Reset Code';
          if (!result.ok) {
            showError((result.data && result.data.error) || 'Request failed');
            return;
          }

          currentEmail = email;
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
          showSuccess(result.data.message || 'If that email exists, a code was sent. Check your inbox.');
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Send Reset Code';
          showError('Cannot reach server. Is npm start running?');
        });
    }

    function resetPassword() {
      var code = document.getElementById('code').value.trim();
      var newPass = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;

      if (!code || !newPass || !confirm) {
        showError('Please fill in all fields.');
        return;
      }
      if (newPass.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
      if (newPass !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      var btn = document.getElementById('resetBtn');
      btn.disabled = true;

      fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: currentEmail,
          code: code,
          newPassword: newPass
        })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          btn.disabled = false;
          if (!result.ok) {
            showError((result.data && result.data.error) || 'Reset failed');
            return;
          }
          showSuccess('Password reset successfully! Redirecting to login...');
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 1500);
        })
        .catch(function () {
          btn.disabled = false;
          showError('Cannot reach server.');
        });
    }

    function goBack() {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
      currentEmail = '';
    }
  </script>
</body>
</html>
