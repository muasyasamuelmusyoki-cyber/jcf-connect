<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – JCF Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #c41e3a;
      --accent-hover: #e63950;
      --gold: #d4a017;
      --bg: #080f18;
      --card: #111c2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e3352;
      --input-bg: #0c1524;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(196,30,58,0.1) 0%, transparent 55%);
      pointer-events: none;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.2rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo-section { text-align: center; margin-bottom: 1.8rem; }
    .logo-wrapper {
      display: inline-flex;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(196,30,58,0.15), rgba(30,58,95,0.2));
      border: 1px solid rgba(196,30,58,0.25);
      align-items: center; justify-content: center;
      margin-bottom: 0.9rem;
    }
    .logo { width: 55px; height: 55px; object-fit: contain; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.35rem; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.88rem 1rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196,30,58,0.18);
    }
    .btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, var(--accent), #9b1b2e);
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(196,30,58,0.35);
    }
    .btn:hover { opacity: 0.95; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      box-shadow: none;
      margin-top: 0.75rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .msg {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .msg.error {
      background: rgba(196,30,58,0.12);
      border: 1px solid rgba(196,30,58,0.3);
      color: #fca5a5;
    }
    .msg.success {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
    .msg.show { display: block; }
    .code-box {
      background: rgba(255,255,255,0.04);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      margin: 1.2rem 0;
      display: none;
    }
    .code-box.show { display: block; }
    .code-value {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--gold);
      margin: 0.5rem 0;
    }
    .code-note { font-size: 0.75rem; color: var(--text-muted); }
    .step { display: none; }
    .step.active { display: block; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="../assets/images/logo.jpg" alt="Logo" class="logo" />
      </div>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your email and we will send you a reset code.</p>
    </div>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <!-- STEP 1: Enter Email -->
    <div class="step active" id="step1">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <button class="btn" onclick="sendCode()">Send Reset Code</button>
      <a href="login.html" class="back-link">← Back to Login</a>
    </div>

    <!-- STEP 2: Enter Code + New Password -->
    <div class="step" id="step2">
      <div class="code-box show" id="codeBox">
        <div class="code-note">Simulated email sent. Your reset code is:</div>
        <div class="code-value" id="displayCode">------</div>
        <div class="code-note">(In production this would be sent to your email)</div>
      </div>

      <div class="form-group">
        <label for="code">Enter 6-digit Code</label>
        <input type="text" id="code" placeholder="123456" maxlength="6" />
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" />
      </div>
      <button class="btn" onclick="resetPassword()">Reset Password</button>
      <button class="btn btn-secondary" onclick="goBack()">Use different email</button>
    </div>
  </div>

  <script>
    // Same users as login
    const USERS = [
      { email: "admin@jcf.rongai", password: "Admin@2026", name: "System Admin", role: "Super Admin" },
      { email: "pastor@jcf.rongai", password: "Pastor@2026", name: "Pastor Samuel", role: "Pastor" },
      { email: "secretary@jcf.rongai", password: "Secretary@1", name: "Mary Wanjiku", role: "Secretary" },
      { email: "treasurer@jcf.rongai", password: "Treasurer@1", name: "James Otieno", role: "Treasurer" }
    ];

    let currentEmail = "";
    let generatedCode = "";

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    function sendCode() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) {
        showError('Please enter your email address.');
        return;
      }

      const user = USERS.find(u => u.email === email);
      if (!user) {
        showError('No account found with this email.');
        return;
      }

      // Generate 6-digit code
      generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
      currentEmail = email;

      // Save temporarily
      localStorage.setItem('jcf_reset', JSON.stringify({
        email: email,
        code: generatedCode,
        expires: Date.now() + 10 * 60 * 1000 // 10 minutes
      }));

      // Show the code (simulating email)
      document.getElementById('displayCode').textContent = generatedCode;
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('errorMsg').classList.remove('show');
      showSuccess('Reset code generated. Enter it below.');
    }

    function resetPassword() {
      const code = document.getElementById('code').value.trim();
      const newPass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!code || !newPass || !confirm) {
        showError('Please fill in all fields.');
        return;
      }

      if (newPass.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      if (newPass !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      const resetData = JSON.parse(localStorage.getItem('jcf_reset') || '{}');

      if (!resetData.code || resetData.email !== currentEmail) {
        showError('Reset session expired. Please start again.');
        return;
      }

      if (Date.now() > resetData.expires) {
        showError('Reset code has expired. Please request a new one.');
        return;
      }

      if (code !== resetData.code) {
        showError('Invalid reset code.');
        return;
      }

      // Update password in localStorage (demo only)
      // In real system this would update the database
      let storedUsers = JSON.parse(localStorage.getItem('jcf_users') || 'null');
      if (!storedUsers) {
        storedUsers = USERS.map(u => ({...u}));
      }

      const idx = storedUsers.findIndex(u => u.email === currentEmail);
      if (idx !== -1) {
        storedUsers[idx].password = newPass;
        localStorage.setItem('jcf_users', JSON.stringify(storedUsers));
      }

      localStorage.removeItem('jcf_reset');
      showSuccess('Password reset successfully! Redirecting to login...');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1800);
    }

    function goBack() {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
      generatedCode = "";
      currentEmail = "";
    }
  </script>
</body>
</html>
